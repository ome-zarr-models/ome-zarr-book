[project]
name = "ome-zarr-book"
version = "1.0"
description = "An introduction to OME-Zarr for big bioimaging data."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "imageio[tifffile]==2.37.3",
    "jupyter-book==2.1.4",
    "matplotlib==3.10.9",
    "numcodecs==0.16.5",
    "numpy==2.4.4",
    "zarr==3.2.0",
    "rich==15.0.0",
    "pydantic-zarr==0.10.0",
    "ome-zarr-models==1.7",
    "joblib==1.5.3",
    "scipy==1.17.1",
]

[tool.setuptools]
packages = []

[dependency-groups]
dev = ["jupyter-ruff==0.3.1", "jupyterlab==4.5.7", "jupytext==1.19.1"]
